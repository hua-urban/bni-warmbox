<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script>
/* LINE WebView 自動跳外部瀏覽器（沿用窩的家共用 snippet，避免 LINE 內建瀏覽器快取/cookie 限制） */
(function () {
  var ua = navigator.userAgent || '';
  var isLine = /Line\//.test(ua);
  var url = new URL(location.href);
  var alreadyRedirected = url.searchParams.has('openExternalBrowser');
  if (isLine && !alreadyRedirected) {
    url.searchParams.set('openExternalBrowser', '1');
    window.location.href = url.toString();
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<title>新人保溫箱進度追蹤・BNI華都更分會</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0e0d0b">
<style>
  :root{
    color-scheme:dark;
    --bg:#0e0d0b; --bg-soft:#16140f; --paper:#1c1a14;
    --ink:#ede6d3; --ink-dim:#9a917a;
    --gold:#c9a961; --gold-bright:#e8c97a; --gold-deep:#8a7440;
    --gold-tint-10:rgba(201,169,97,.10); --gold-tint-16:rgba(201,169,97,.16);
    --crimson:#b04a3a; --crimson-tint-12:rgba(176,74,58,.12);
    --line:#2a261c;
    --radius-lg:8px; --radius-md:3px; --radius-sm:2px;
    --ease-out:cubic-bezier(.23,1,.32,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow-x:hidden;width:100%}
  body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.6;font-size:16px;
       -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
       padding-bottom:60px}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select{font-family:inherit;font-size:16px;color:var(--ink);max-width:100%}
  input::placeholder{color:var(--ink-dim)}
  ::selection{background:var(--gold);color:var(--bg)}

  h1,h2,h3,.section-title,.mcard .name{
    font-family:"Noto Serif TC",serif;
  }

  /* Header */
  .hero{background:linear-gradient(180deg,var(--bg-soft) 0%,var(--bg) 100%);color:var(--ink);
        padding:30px 16px 26px;text-align:center;border-bottom:1px solid var(--line)}
  .hero-badge{width:52px;height:52px;margin:0 auto 12px;border-radius:50%;
        background:var(--paper);border:1.5px solid var(--gold);
        display:flex;align-items:center;justify-content:center}
  .crest{font-family:"Noto Serif TC",serif;font-weight:900;font-size:22px;color:var(--gold-bright);line-height:1}
  .hero .kicker{font-family:"Cormorant Garamond",serif;font-size:14px;font-weight:600;
        letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
  .hero .kicker::before,.hero .kicker::after{content:'✦';margin:0 8px;color:var(--gold-deep);font-size:10px;vertical-align:middle}
  .hero h1{font-size:clamp(26px,6vw,36px);font-weight:700;margin:4px 0 8px;letter-spacing:.01em;text-wrap:balance;
        background:linear-gradient(135deg,var(--ink) 0%,var(--gold-bright) 100%);
        -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hero p{font-size:13.5px;color:var(--ink-dim);overflow-wrap:break-word}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}
  @media(min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
  .stat{background:var(--paper);border-radius:var(--radius-md);padding:14px 6px;text-align:center;
        border:1px solid var(--line);min-width:0}
  .stat .num{font-size:22px;font-weight:800;color:var(--gold-bright);font-variant-numeric:tabular-nums}
  .stat .lab{font-size:11.5px;color:var(--ink-dim);margin-top:3px;font-weight:500}

  /* toolbar */
  .toolbar{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .toolbar .btns{display:flex;gap:10px;flex-wrap:wrap}
  .btn{padding:11px 18px;min-height:44px;border-radius:var(--radius-md);font-weight:700;font-size:14.5px;
       display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--ink-dim);
       border:1px solid var(--line);
       transition:transform 140ms var(--ease-out),border-color 140ms var(--ease-out),color 140ms var(--ease-out),background 140ms var(--ease-out)}
  .btn svg{flex:none}
  .btn-primary{border-color:var(--gold-deep);color:var(--gold-bright);font-weight:800}
  .btn-primary:hover{border-color:var(--gold);background:var(--gold-tint-10)}
  .btn-primary:active{transform:scale(.97)}
  .btn-outline{background:transparent;color:var(--ink-dim);border:1px solid var(--line)}
  .btn-outline:hover{border-color:var(--gold-deep);color:var(--ink)}
  .btn-outline:active{transform:scale(.97)}
  .btn-ghost{background:transparent;color:var(--ink-dim);text-decoration:underline;padding:8px;border:none}
  .identity{font-size:13px;color:var(--ink-dim);background:var(--paper);border:1px solid var(--line);
             border-radius:var(--radius-md);padding:7px 14px;display:inline-flex;align-items:center;gap:6px;min-width:0}
  .identity button{color:var(--gold);font-weight:700;text-decoration:underline;background:none}

  /* section */
  .section-title{font-size:17px;font-weight:700;margin:28px 0 12px;color:var(--ink);
        letter-spacing:.01em;border-left:2px solid var(--gold-deep);padding-left:10px}
  .hint{display:inline-block;margin-top:6px;font-size:12px;color:var(--ink-dim);opacity:.85}
  .empty{color:var(--ink-dim);font-size:14px;background:var(--paper);border:1px dashed var(--line);
         border-radius:var(--radius-md);padding:26px;text-align:center;overflow-wrap:break-word}

  /* member cards */

  .mcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);
         padding:14px 16px;text-align:left;width:100%;
         transition:border-color 140ms var(--ease-out)}
  .mcard:hover{border-color:var(--gold-deep)}
  .mcard:active{border-color:var(--gold)}
  .mcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .mcard-info{min-width:0;flex:1}
  .mcard .name{font-size:16px;font-weight:700;color:var(--ink)}
  .meta{font-size:12.5px;color:var(--ink-dim);overflow-wrap:break-word;word-break:break-word}
  .mcard .meta{margin-top:2px}
  .badge{position:relative;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:var(--radius-sm);
         flex:none;white-space:nowrap;border:1px solid var(--line)}
  .badge.ing{background:var(--bg-soft);color:var(--ink-dim);border-color:var(--line)}
  .badge.grad{background:var(--gold-tint-16);color:var(--gold-bright);border:2px solid var(--gold-bright);font-weight:800}
  .badge.ready{background:transparent;color:var(--gold-bright);border:1.5px solid var(--gold)}
  .pbar{margin-top:10px;height:8px;background:var(--line);border-radius:var(--radius-sm);overflow:hidden}
  .pbar .fill{height:100%;background:linear-gradient(90deg,var(--gold) 0%,var(--gold-bright) 100%);border-radius:var(--radius-sm);
              transition:width 300ms var(--ease-out)}
  .pbar.done .fill{background:var(--gold-bright)}
  .pct{font-size:11.5px;color:var(--ink-dim);margin-top:4px;text-align:right;
       font-variant-numeric:tabular-nums}

  /* overview table (desktop only) */
  .overview-wrap{display:none}
  @media(min-width:880px){
    .overview-wrap{display:block}
    #mainArea{display:none}
  }
  .table-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;overflow-x:auto}
  .ov-table{width:100%;border-collapse:collapse}
  .ov-table th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink-dim);
               padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg-soft);white-space:nowrap}
  .ov-table td{padding:12px 16px;font-size:14px;color:var(--ink);border-top:1px solid var(--line);

  .ov-table tbody tr:first-child td{border-top:none}
  .ov-table tbody tr{cursor:pointer;transition:background 120ms var(--ease-out)}
  .ov-table tbody tr:hover{background:var(--gold-tint-10)}
  .ov-table .ov-name{font-weight:700;color:var(--ink);white-space:nowrap}
  .ov-table .pbar{margin-top:0;width:140px}
  .ov-table .pct{text-align:left;margin-top:4px}
  .empty-row td{text-align:center;color:var(--ink-dim);padding:30px 16px}

  /* overlay */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;
           display:flex;align-items:flex-end;justify-content:center}
  .overlay.hidden{display:none}
  .sheet{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
         border:1px solid var(--line);border-bottom:none;
         border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:20px 18px 32px;
         box-shadow:0 -8px 32px rgba(0,0,0,.5);
         animation:sheetUp 240ms var(--ease-out)}
  @media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:var(--radius-lg);max-height:88vh;border-bottom:1px solid var(--line);
         box-shadow:0 20px 60px rgba(0,0,0,.6)}}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
  .sheet-head h2{font-size:19px;font-weight:700;color:var(--ink);min-width:0;overflow-wrap:break-word}
  .close-x{font-size:18px;color:var(--ink-dim);background:none;padding:6px 10px;border-radius:var(--radius-sm);flex:none}
  .close-x:hover{background:var(--gold-tint-10);color:var(--ink)}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:6px}
  .field input,.field select{width:100%;padding:11px 14px;border:1px solid var(--line);
                              border-radius:var(--radius-md);background:var(--bg);color:var(--ink)}
  .field input:focus,.field select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-tint-16)}
  .form-actions{display:flex;gap:10px;margin-top:18px}
  .form-actions .btn{flex:1;justify-content:center}
  .form-msg{font-size:13px;color:var(--ink);margin-top:6px;min-height:18px}
  .form-msg:not(:empty){border-left:2px solid var(--crimson);padding-left:8px;font-weight:600}

  /* detail */
  .grad-banner{background:var(--paper);color:var(--ink);border:1.5px solid var(--gold);border-radius:var(--radius-md);
               padding:18px;text-align:center;margin-bottom:16px}
  .grad-banner h3{font-size:16px;font-weight:700;color:var(--gold-bright);margin-bottom:10px;line-height:1.4}
  .grad-banner .btn{background:transparent;color:var(--gold-bright);border:1.5px solid var(--gold);
               width:100%;justify-content:center;font-weight:800}
  .grad-banner .btn:hover{background:var(--gold-tint-10)}
  .grad-done{background:var(--gold-tint-16);color:var(--ink);border:1px solid var(--gold-deep);
             border-radius:var(--radius-md);padding:14px;text-align:center;font-weight:700;margin-bottom:16px}

  .stage{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);margin-bottom:12px;overflow:hidden}
  .stage-head{background:var(--bg-soft);padding:10px 16px;display:flex;justify-content:space-between;
              align-items:center;font-weight:700;font-size:14px;color:var(--gold-bright);gap:8px;
              border-bottom:1px solid var(--line)}
  .stage-head span:first-child{min-width:0;overflow-wrap:break-word}
  .stage-head .cnt{font-size:11.5px;font-weight:700;background:var(--paper);color:var(--ink-dim);border:1px solid var(--line);
                    border-radius:var(--radius-sm);padding:2px 10px;flex:none;font-variant-numeric:tabular-nums}
  .item-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);
            width:100%;text-align:left;background:var(--paper);transition:background 120ms var(--ease-out)}
  .item-row:hover{background:var(--gold-tint-10)}
  .item-row:active{background:var(--gold-tint-16)}
  .chk{flex:none;width:24px;height:24px;border-radius:var(--radius-sm);border:1.5px solid var(--line);
       display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--bg);background:var(--bg)}
  .chk.on{background:linear-gradient(135deg,var(--gold) 0%,var(--gold-bright) 100%);border-color:var(--gold-bright);
          color:var(--bg);animation:checkPop 220ms var(--ease-out)}
  .item-label{font-size:14.5px;color:var(--ink);flex:1;min-width:0;overflow-wrap:break-word}
  .item-row.busy{opacity:.5}

  @keyframes checkPop{0%{transform:scale(.6)}65%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes sheetUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

  .danger-zone{margin-top:22px;text-align:center}
  .danger-zone button{color:var(--ink-dim);font-size:13px;text-decoration:underline;text-decoration-color:var(--crimson);background:none}
  .danger-zone button:hover{color:var(--ink);background:var(--crimson-tint-12)}

  .id-banner{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);
             padding:14px 16px;margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .id-banner span{color:var(--ink);overflow-wrap:break-word;min-width:0}
  .id-banner input{flex:1 1 160px;min-width:0;padding:10px 12px;border-radius:var(--radius-sm);
                    border:1px solid var(--line);background:var(--bg);color:var(--ink)}

  .loading,.err-box{text-align:center;color:var(--ink-dim);padding:40px 20px}
  .err-box{color:var(--ink);background:var(--paper);border:1px solid var(--crimson);border-radius:var(--radius-md)}
  .err-box button{margin-top:10px}

  footer{text-align:center;color:var(--ink-dim);font-size:12px;margin-top:40px;padding-top:16px;
         border-top:1px solid var(--line);overflow-wrap:break-word}

  button:focus-visible,input:focus-visible,select:focus-visible{
    outline:2px solid var(--gold-bright);outline-offset:2px}

  @media(min-width:720px){
    .card-list{grid-template-columns:repeat(2,1fr)}
  }

  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<script>
var GAS_EXEC_URL = 'https://script.google.com/macros/s/AKfycbwyWw0XtpBck_v_rQuPAAZ8n0wYN2HciZr5a4S7g-QAPMrOXSS-HehPVeyhVoMtedM/exec';
var IDENTITY_KEY = 'warmbox_identity_v1';

var state = { stages: [], items: [], members: [], progress: {}, itemsByStage: {} };

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
}); }

function getIdentity(){ return localStorage.getItem(IDENTITY_KEY) || ''; }
function setIdentity(name){ localStorage.setItem(IDENTITY_KEY, name); renderIdentityUI(); }

function renderIdentityUI(){
  var name = getIdentity();
  document.getElementById('idBanner').style.display = name ? 'none' : 'flex';
  document.getElementById('identityChip').style.display = name ? 'inline-flex' : 'none';
  document.getElementById('identityName').textContent = name;
}

document.getElementById('idSaveBtn').onclick = function(){
  var v = document.getElementById('idInput').value.trim();
  if (v) setIdentity(v);
};
document.getElementById('changeIdentityBtn').onclick = function(){
  var v = prompt('更改你的名字：', getIdentity());
  if (v && v.trim()) setIdentity(v.trim());
};

// Google Apps Script 冷啟動時偶發 404／逾時，且第一次呼叫可能要 10 秒以上。
// 自動重試 2 次（間隔 1.5s / 3s），並設 25 秒逾時，避免畫面永遠停在「讀取中…」。
function fetchWithTimeout(url, opts, ms){
  return new Promise(function(resolve, reject){
    var done = false;
    var timer = setTimeout(function(){ if(!done){ done = true; reject(new Error('等太久沒有回應')); } }, ms || 25000);
    fetch(url, opts).then(function(r){
      if (done) return;
      done = true; clearTimeout(timer);
      if (!r.ok) { reject(new Error('伺服器回應 ' + r.status)); return; }
      resolve(r);
    }).catch(function(e){ if(!done){ done = true; clearTimeout(timer); reject(e); } });
  });
}
function withRetry(fn, tries){
  tries = tries || 3;
  return fn().catch(function(e){
    if (tries <= 1) throw e;
    return new Promise(function(r){ setTimeout(r, (4 - tries) * 1500); })
      .then(function(){ return withRetry(fn, tries - 1); });
  });
}
function apiGet(action){
  return withRetry(function(){
    return fetchWithTimeout(GAS_EXEC_URL + '?action=' + encodeURIComponent(action) + '&_=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.json(); });
  });
}
function apiPost(payload){
  // 與 apiGet 同樣要防冷啟動：不加重試與逾時的話，按下去會像完全沒反應。
  // createMember 帶自產的 clientKey，後端據此擋掉重試造成的重複建檔。
  if (payload.action === 'createMember' && !payload.clientKey) {
    payload.clientKey = 'C' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
  }
  return withRetry(function(){
    return fetchWithTimeout(GAS_EXEC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function(r){ return r.json(); });
  });
}
// 送出期間鎖住按鈕並顯示狀態，避免使用者以為沒反應而重複點擊。
function busy(btn, label){
  if (!btn) return function(){};
  var old = btn.innerHTML;
  btn.disabled = true;
  btn.style.opacity = '.6';
  btn.innerHTML = label;
  return function(){ btn.disabled = false; btn.style.opacity = ''; btn.innerHTML = old; };
}

// 兩個容器都要更新：桌機寬度時 #mainArea 被 CSS 隱藏，只寫它畫面上看不到。
function setLoadingMsg(html){
  var m = document.getElementById('mainArea');
  if (m) m.innerHTML = '<div class="loading">' + html + '</div>';
  var ov = document.getElementById('overviewTable');
  if (ov) ov.innerHTML = '<tr class="empty-row"><td colspan="6">' + html + '</td></tr>';
}
var loadTicker = null;
function loadAll(){
  var t0 = Date.now();
  setLoadingMsg('讀取中…');
  clearInterval(loadTicker);
  // Google 的伺服器閒置一陣子後第一次呼叫要 10～20 秒才會醒，
  // 沒有秒數提示會讓人以為當掉。
  loadTicker = setInterval(function(){
    var s = Math.round((Date.now() - t0) / 1000);
    if (s >= 4) setLoadingMsg('系統喚醒中，請稍候…（已等 ' + s + ' 秒）<br><span class="hint">閒置一段時間後第一次開啟大約需要 10 到 20 秒</span>');
  }, 1000);
  return apiGet('roster').then(function(res){
    clearInterval(loadTicker);
    if (!res.ok) throw new Error(res.message || '讀取失敗');
    state.stages = res.stages.sort(function(a,b){ return a.order - b.order; });
    state.items = res.items.sort(function(a,b){ return a.order - b.order; });
    state.members = res.members;
    state.progress = res.progress;
    state.itemsByStage = {};
    state.items.forEach(function(it){
      (state.itemsByStage[it.stageId] = state.itemsByStage[it.stageId] || []).push(it);
    });
    renderMentorList();
    renderStats();
    renderMemberList();
    renderOverviewTable();
  }).catch(function(e){
    clearInterval(loadTicker);
    // 桌機寬度時 #mainArea 被 CSS 隱藏，只更新它會讓畫面永遠停在「讀取中…」，
    // 所以錯誤訊息與重試按鈕兩個容器都要寫。
    var msg = '讀取失敗：' + esc(e.message);
    document.getElementById('mainArea').innerHTML =
      '<div class="err-box">' + msg + '<br><button class="btn btn-outline retryBtn">重新讀取</button></div>';
    var ov = document.getElementById('overviewTable');
    if (ov) {
      ov.innerHTML = '<tr class="empty-row"><td colspan="6">' + msg +
        '　<button class="btn btn-outline retryBtn">重新讀取</button></td></tr>';
    }
    Array.prototype.forEach.call(document.querySelectorAll('.retryBtn'), function(b){ b.onclick = loadAll; });
  });
}

function renderMentorList(){
  var names = {};
  state.members.forEach(function(m){ if (m.mentor) names[m.mentor] = true; });
  document.getElementById('mentorList').innerHTML =
    Object.keys(names).map(function(n){ return '<option value="' + esc(n) + '">'; }).join('');
}

function requiredItemIds(){
  var stageTypeById = {};
  state.stages.forEach(function(s){ stageTypeById[s.id] = s.type; });
  return state.items.filter(function(it){
    var t = stageTypeById[it.stageId];
    return t === 'required';
  }).map(function(it){ return it.id; });
}

function memberProgressCount(memberId){
  var done = 0;
  state.items.forEach(function(it){
    var p = state.progress[memberId + '|' + it.id];
    if (p && p.done) done++;
  });
  return { done: done, total: state.items.length };
}

function isEligible(memberId){
  var req = requiredItemIds();
  if (!req.length) return false;
  return req.every(function(id){
    var p = state.progress[memberId + '|' + id];
    return p && p.done;
  });
}

function renderStats(){
  var total = state.members.length;
  var ing = state.members.filter(function(m){ return m.status !== '已畢業'; });
  var grad = state.members.filter(function(m){ return m.status === '已畢業'; });
  var avgPct = 0;
  if (ing.length) {
    var sum = 0;
    ing.forEach(function(m){
      var c = memberProgressCount(m.id);
      sum += c.total ? (c.done / c.total) : 0;
    });
    avgPct = Math.round((sum / ing.length) * 100);
  }
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statIng').textContent = ing.length;
  document.getElementById('statGrad').textContent = grad.length;
  document.getElementById('statPct').textContent = ing.length ? (avgPct + '%') : '—';
}

function memberCard(m){
  var c = memberProgressCount(m.id);
  var pct = c.total ? Math.round((c.done / c.total) * 100) : 0;
  var graduated = m.status === '已畢業';
  var eligible = !graduated && isEligible(m.id);
  var badge = graduated
    ? '<span class="badge grad">已畢業</span>'
    : (eligible ? '<span class="badge ready">可以畢業了</span>' : '<span class="badge ing">進行中</span>');
  return (
    '<button class="mcard" data-member="' + esc(m.id) + '">' +
      '<div class="top">' +
        '<div class="mcard-info"><div class="name">' + esc(m.name) + '</div>' +
        '<div class="meta">' + esc(m.profession || '未填專業別') + '　｜　導師：' + esc(m.mentor) + '　｜　宣誓：' + esc(m.oathDate) + '</div></div>' +
        badge +
      '</div>' +
      '<div class="pbar' + (pct >= 100 ? ' done' : '') + '"><div class="fill" style="width:' + pct + '%"></div></div>' +
      '<div class="pct">' + c.done + ' / ' + c.total + '（' + pct + '%）</div>' +
    '</button>'
  );
}

function renderMemberList(){
  var ing = state.members.filter(function(m){ return m.status !== '已畢業'; });
  var grad = state.members.filter(function(m){ return m.status === '已畢業'; });

  var html = '';
  html += '<div class="section-title">進行中（' + ing.length + '）</div>';
  html += ing.length
    ? '<div class="card-list">' + ing.map(memberCard).join('') + '</div>'
    : '<div class="empty">目前沒有進行中的新人，按「新增新會員」開始追蹤</div>';

  if (grad.length) {
    html += '<div class="section-title">已畢業（' + grad.length + '）</div>';
    html += '<div class="card-list">' + grad.map(memberCard).join('') + '</div>';
  }

  document.getElementById('mainArea').innerHTML = html;
  document.querySelectorAll('.mcard').forEach(function(el){
    el.onclick = function(){ openDetail(el.getAttribute('data-member')); };
  });
}

function renderOverviewTable(){
  var el = document.getElementById('overviewTable');
  if (!el) return;
  var rows = state.members.map(function(m){
    var c = memberProgressCount(m.id);
    var pct = c.total ? Math.round((c.done / c.total) * 100) : 0;
    var graduated = m.status === '已畢業';
    var eligible = !graduated && isEligible(m.id);
    var badge = graduated
      ? '<span class="badge grad">已畢業</span>'
      : (eligible ? '<span class="badge ready">可以畢業了</span>' : '<span class="badge ing">進行中</span>');
    return '<tr data-member="' + esc(m.id) + '">' +
      '<td class="ov-name">' + esc(m.name) + '</td>' +
      '<td>' + esc(m.profession || '—') + '</td>' +
      '<td>' + esc(m.mentor) + '</td>' +
      '<td>' + esc(m.oathDate) + '</td>' +
      '<td><div class="pbar' + (pct >= 100 ? ' done' : '') + '"><div class="fill" style="width:' + pct + '%"></div></div>' +
        '<div class="pct">' + c.done + ' / ' + c.total + '（' + pct + '%）</div></td>' +
      '<td>' + badge + '</td>' +
    '</tr>';
  }).join('');
  el.innerHTML = rows || '<tr class="empty-row"><td colspan="6">目前沒有會員資料</td></tr>';
  el.querySelectorAll('tr[data-member]').forEach(function(tr){
    tr.onclick = function(){ openDetail(tr.getAttribute('data-member')); };
  });
}

function openDetail(memberId){
  var m = state.members.find(function(x){ return x.id === memberId; });
  if (!m) return;
  var graduated = m.status === '已畢業';
  var eligible = !graduated && isEligible(m.id);
  var c = memberProgressCount(m.id);
  var pct = c.total ? Math.round((c.done / c.total) * 100) : 0;

  var html = '';
  html += '<div class="sheet-head"><h2>' + esc(m.name) + '</h2><button class="close-x" data-close="detailOverlay">✕</button></div>';
  html += '<div class="meta" style="margin-bottom:14px">' + esc(m.profession || '未填專業別') +
          '　｜　導師：' + esc(m.mentor) + '　｜　宣誓：' + esc(m.oathDate) + '</div>';
  html += '<div class="pbar' + (pct >= 100 ? ' done' : '') + '"><div class="fill" style="width:' + pct + '%"></div></div>';
  html += '<div class="pct">整體完成 ' + c.done + ' / ' + c.total + '（' + pct + '%）</div>';

  if (graduated) {
    html += '<div class="grad-done">已於 ' + esc(m.gradDate) + ' 出保溫箱畢業</div>';
  } else if (eligible) {
    html += '<div class="grad-banner"><h3>三部曲都完成了，可以出保溫箱進大群</h3>' +
            '<button class="btn" id="graduateBtn" data-member="' + esc(m.id) + '">標記出保溫箱畢業</button></div>';
  }

  state.stages.forEach(function(stage){
    var items = state.itemsByStage[stage.id] || [];
    if (!items.length) return;
    var doneCnt = items.filter(function(it){
      var p = state.progress[m.id + '|' + it.id];
      return p && p.done;
    }).length;
    html += '<div class="stage">';
    html += '<div class="stage-head"><span>' + esc(stage.name) +
            (stage.passportPage && stage.passportPage !== '—' ? '（' + esc(stage.passportPage) + '）' : '') +
            '</span><span class="cnt">' + doneCnt + '/' + items.length + '</span></div>';
    items.forEach(function(it){
      var p = state.progress[m.id + '|' + it.id];
      var on = !!(p && p.done);
      html += '<button class="item-row" data-item="' + esc(it.id) + '" data-member="' + esc(m.id) + '">' +
              '<span class="chk' + (on ? ' on' : '') + '">' + (on ? '✓' : '') + '</span>' +
              '<span class="item-label">' + esc(it.label) + '</span></button>';
    });
    html += '</div>';
  });

  html += '<div class="danger-zone"><button id="deleteMemberBtn" data-member="' + esc(m.id) + '">刪除這位會員（建錯了才用）</button></div>';

  document.getElementById('detailSheet').innerHTML = html;
  document.getElementById('detailOverlay').classList.remove('hidden');

  document.querySelectorAll('#detailSheet .item-row').forEach(function(el){
    el.onclick = function(){ toggleItem(el.getAttribute('data-member'), el.getAttribute('data-item')); };
  });
  var gradBtn = document.getElementById('graduateBtn');
  if (gradBtn) gradBtn.onclick = function(){ doGraduate(gradBtn.getAttribute('data-member')); };
  var delBtn = document.getElementById('deleteMemberBtn');
  if (delBtn) delBtn.onclick = function(){ doDeleteMember(delBtn.getAttribute('data-member'), m.name); };
}

function toggleItem(memberId, itemId){
  var editor = getIdentity();
  if (!editor) { alert('請先在上方填你的名字，才能記錄是誰勾選的'); return; }
  var key = memberId + '|' + itemId;
  var current = !!(state.progress[key] && state.progress[key].done);
  var next = !current;

  var row = document.querySelector('#detailSheet .item-row[data-item="' + itemId + '"]');
  if (row) row.classList.add('busy');

  apiPost({ action: 'toggleItem', memberId: memberId, itemId: itemId, done: next, editor: editor })
    .then(function(res){
      if (!res.ok) { alert('存檔失敗：' + res.message); return; }
      state.progress[key] = { done: next, date: '', editor: editor };
      renderStats();
      openDetail(memberId);
      var idx = state.members.findIndex(function(m){ return m.id === memberId; });
      if (idx >= 0) renderMemberListKeepScroll();
      renderOverviewTable();
    })
    .catch(function(e){ alert('存檔失敗（網路或系統忙線）：' + e.message); })
    .finally(function(){ if (row) row.classList.remove('busy'); });
}

function renderMemberListKeepScroll(){
  renderMemberList();
}

function doGraduate(memberId){
  var editor = getIdentity();
  if (!editor) { alert('請先在上方填你的名字'); return; }
  if (!confirm('確定要標記這位會員「出保溫箱畢業」嗎？畢業後請記得在大群公告、回報領導團隊。')) return;
  apiPost({ action: 'graduate', memberId: memberId, editor: editor }).then(function(res){
    if (!res.ok) { alert(res.message); return; }
    return loadAll().then(function(){ openDetail(memberId); });
  }).catch(function(e){ alert('操作失敗：' + e.message); });
}

function doDeleteMember(memberId, name){
  if (!confirm('確定要刪除「' + name + '」嗎？這個人的所有勾選紀錄會一併刪除，無法復原（可從 Google 試算表的版本紀錄救回）。')) return;
  apiPost({ action: 'deleteMember', memberId: memberId }).then(function(res){
    if (!res.ok) { alert(res.message); return; }
    document.getElementById('detailOverlay').classList.add('hidden');
    return loadAll();
  }).catch(function(e){ alert('刪除失敗：' + e.message); });
}

// 新增會員
document.getElementById('newMemberBtn').onclick = function(){
  // 預熱：使用者還在填表單的這幾十秒先把後端叫醒，按下建立時就不必等冷啟動。
  fetch(GAS_EXEC_URL + '?action=roster&_warm=' + Date.now(), { cache: 'no-store' }).catch(function(){});
  document.getElementById('newMemberForm').reset();
  document.getElementById('fOathDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('newMemberMsg').textContent = '';
  document.getElementById('newMemberOverlay').classList.remove('hidden');
};
document.getElementById('newMemberForm').onsubmit = function(e){
  e.preventDefault();
  var payload = {
    action: 'createMember',
    name: document.getElementById('fName').value.trim(),
    profession: document.getElementById('fProfession').value.trim(),
    mentor: document.getElementById('fMentor').value.trim(),
    oathDate: document.getElementById('fOathDate').value
  };
  if (!payload.name || !payload.mentor || !payload.oathDate) {
    document.getElementById('newMemberMsg').textContent = '姓名、負責導師、宣誓日期為必填';
    return;
  }
  var msgEl = document.getElementById('newMemberMsg');
  var restore = busy(e.target.querySelector('button[type=submit]'), '建立中…');
  msgEl.textContent = '正在建立，系統剛喚醒時可能要等 10 到 20 秒…';
  apiPost(payload).then(function(res){
    restore();
    if (!res.ok) { msgEl.textContent = res.message; return; }
    msgEl.textContent = '';
    document.getElementById('newMemberOverlay').classList.add('hidden');
    return loadAll();
  }).catch(function(err){
    restore();
    msgEl.textContent = '建立失敗：' + err.message + '（可以再按一次建立檢核表）';
  });
};

// 關閉 modal
document.querySelectorAll('[data-close]').forEach(function(el){
  el.onclick = function(){ document.getElementById(el.getAttribute('data-close')).classList.add('hidden'); };
});

// 匯出報表（前端直接從目前資料產生 CSV，不額外開後端端點）
document.getElementById('exportBtn').onclick = function(){
  var rows = [['姓名','專業別','負責導師','宣誓日期','狀態','已完成項目','總項目','完成度','畢業日期']];
  state.members.forEach(function(m){
    var c = memberProgressCount(m.id);
    var pct = c.total ? Math.round((c.done / c.total) * 100) : 0;
    rows.push([m.name, m.profession, m.mentor, m.oathDate, m.status, c.done, c.total, pct + '%', m.gradDate || '']);
  });
  var csv = '﻿' + rows.map(function(r){
    return r.map(function(v){ return '"' + String(v).replace(/"/g,'""') + '"'; }).join(',');
  }).join('\r\n');
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  var d = new Date();
  var stamp = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  a.href = URL.createObjectURL(blob);
  a.download = '保溫箱進度報表_' + stamp + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
};

renderIdentityUI();
loadAll();
</script>
